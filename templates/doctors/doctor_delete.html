<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Doctor | MediCare Plus</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #164966;
        }

        .page {
            max-width: 650px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .warning {
            font-size: 50px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #71879a;
            font-size: 16px;
            line-height: 1.6;
        }

        .doctor {
            background: #f4f7fb;
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
        }

        .doctor strong {
            display: block;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        button,
        a {
            padding: 13px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            border: none;
            background: #dc3545;
            color: white;
        }

        button:hover {
            background: #bb2d3b;
        }

        a {
            background: #e9eef2;
            color: #164966;
        }

        a:hover {
            background: #dce4e9;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="warning">!</div>

    <h1>Delete Doctor?</h1>

    <p>
        Are you sure you want to delete this doctor?
        This action cannot be undone.
    </p>

    <div class="doctor">
        <strong>{{ doctor.doctor_id }}</strong>
        <span>{{ doctor.specialization }}</span>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="buttons">

            <button type="submit">
                Yes, Delete Doctor
            </button>

            <a href="{% url 'doctor_list' %}">
                Cancel
            </a>

        </div>
    </form>

</div>

</body>
</html>
